# Supabase gratis menjeda proyek setelah 7 hari tanpa aktivitas. Panggilan ringan 2x seminggu mencegahnya.
# Isi Secrets repo: SUPABASE_URL dan SUPABASE_ANON_KEY.
name: keepalive
on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d "{}"
